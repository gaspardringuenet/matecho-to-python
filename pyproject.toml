[tool.uv]
package = true

[project]
name = "matecho-to-python"
version = "0.1.0"
description = "Small CLI tool to convert Matecho (https://pages.iuem.eu/ird/matecho/) Echointegration.mat files into a Zarr store compatible with the Echostack Python tools (https://uw-echospace.github.io/project/echostack/)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.7.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "xarray>=2026.7.0",
    "zarr>=3.3.0",
]

[project.scripts]
matecho-to-python = "matecho_to_python.main:main"
